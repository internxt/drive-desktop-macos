name: Test Internxt Desktop MacOS App

on:
  push:
  workflow_dispatch:

# This envs are available for all the steps
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  SLACK_WEBHOOK_MAC_TEAM: ${{secrets.SLACK_WEBHOOK_MAC_TEAM}}
jobs:
  build:
    runs-on: macos-15
    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      # This step is needed to configure Match profiles
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # TEMPORARY — remove both steps once the daemon publishes releases.
      #
      # The mail-bridge daemon lives in a separate Go repo and is not vendored here,
      # so today the build compiles it from source via
      # scripts/fetch-mail-bridge.sh --from-local, which needs the checkout and a Go
      # toolchain. Tracking main is deliberate while there is nothing to pin.
      #
      # When the daemon cuts its first release (it also needs darwin-amd64 adding to
      # its release matrix, it only builds darwin-arm64 today), switch the Xcode run
      # script to --from-release <pinned version>, add mail-bridge.pin.json with the
      # per-arch sha256, and delete these two steps plus the MAIL_BRIDGE_LOCAL_REPO
      # env below: the script downloads and verifies the tarball on its own, with no
      # checkout and no Go needed. The daemon repo is public, so no token either.
      - name: Checkout mail-bridge daemon
        run: |
          git clone --depth 1 git@github.com:internxt/mail-bridge-desktop.git \
            "${{ github.workspace }}/mail-bridge-desktop"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mail-bridge-desktop/go.mod
          cache: false

      - name: Prepare Xcode cache
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-
  
      - name: Add env.json
        id: create-env-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "env.local.json"
          json: ${{ secrets.JSON_ENV }}
          dir: 'InternxtDesktop/'
      
      - name: Run Xcode Unit Tests
        run: |
          xcodebuild test \
            -project InternxtDesktop.xcodeproj \
            -scheme InternxtDesktop \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        env:
          MAIL_BRIDGE_LOCAL_REPO: ${{ github.workspace }}/mail-bridge-desktop

      - name: Archive logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Internxt Desktop Build Logs
          path: /Users/runner/Library/Logs/

       


          
