name: Test Internxt Desktop MacOS App

on:
  push:
  workflow_dispatch:

# This envs are available for all the steps
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  SLACK_WEBHOOK_MAC_TEAM: ${{secrets.SLACK_WEBHOOK_MAC_TEAM}}
jobs:
  build:
    runs-on: macos-15
    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      # This step is needed to configure Match profiles
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Prepare Xcode cache
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-${{ github.workflow }}-
  
      - name: Add env.json
        id: create-env-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "env.local.json"
          json: ${{ secrets.JSON_ENV }}
          dir: 'InternxtDesktop/'
      
      - name: Run Xcode Unit Tests
        run: |
          xcodebuild test \
            -project InternxtDesktop.xcodeproj \
            -scheme InternxtDesktop \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Internxt Desktop Build Logs
          path: /Users/runner/Library/Logs/

       


          
